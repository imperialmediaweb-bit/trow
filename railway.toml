# Authoritative Railway configuration used for deployment.
# Railway deploys a single service: the backend (backend/Dockerfile), which
# builds and embeds the frontend and serves it on internalPort 3000.
# The backend/ and frontend/ railway.toml files are NOT used for the default
# deployment; they only apply if those directories are deployed as separate
# Railway services.

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "frontend/**"]

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[service]
internalPort = 3000
